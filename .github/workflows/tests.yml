name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  phpunit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.3'
          extensions: zip, intl, gd, pdo_mysql
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --no-scripts --ignore-platform-reqs
      - run: vendor/bin/phpunit
